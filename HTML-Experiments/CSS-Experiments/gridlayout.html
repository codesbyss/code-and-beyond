<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset=""utf-8>
        <meta name="viewpoint" content="width=device-width,initial-scale.0">
        <title>grid layout</title>
        <style>
            * html {
                margin: 0;
                padding:0;
                box-sizing: border-box;
            }
            main{
                width: 1200px;
                height: 900px;
                margin:0 auto;
                display:grid;
                grid-template-columns: 1fr;
                grid-template-rows: 200px 80px 500px 150px;
                gap: 10px;
            }
            header,nav,footer{
                background-color: violet;
                display: grid;
                place-items: center;
            }
            section{
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 10px;
            }
            #left,#right {
                height: 500px;
                display: grid;
                place-items: center;
                background-color: aqua;
            }
            #right{
                display: grid;
                grid-template-rows: 1fr 1fr;
                gap: 10px;
            }
            .right-top,
            .right-bottom{
                background-color: blueviolet;
                display: grid;
                place-items: center;
            }

        </style>
    </head>
    <body>
        <main>
            <header><h2>Header</h2></header>
            <nav><h2>Nav</h2></nav>
            <section>
                <div id="left"><h2>left</h2></div>
                <div id="right">
                    <div class="right-top"><h2>Right Top</h2></div>
                    <div class="right-bottom"><h2>Right Bottom</h2></div>
            </section>
            <footer><h2>footer</h2></footer>
        </main>
    </body>
</html>
